[package]
name = "gofile"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
base16ct = { version = "1.0.0", features = [ "alloc" ] }
reqwest = { version = "0.13.5", features = [ "json", "multipart", "stream" ], default-features = false }
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = [ "derive" ] }
sha2 = "0.11.2"
thiserror = "2.0.21"
time = { version = "0.3.55", features = [ "serde" ] }
tokio = "1.54.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = [ "macros" ] }

[features]
default = [ "rustls" ]
native-tls = [ "reqwest/native-tls" ]
rustls = [ "reqwest/rustls" ]

